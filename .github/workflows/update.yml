name: Update competitor news

on:
  schedule:
    - cron: "2-59/15 * * * *"
  workflow_dispatch:           # "Run workflow" button for an immediate refresh
  push:
    branches: [main]
    paths: ["companies.yaml", "scripts/**", "index.html", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/fetch.py

      # Keep the news history in the repo so "first seen" dates survive between runs.
      # If another run saved data in the meantime, keep this run's (newer) data and retry.
      - name: Commit data if it changed
        run: |
          git config user.name  "ci-news-bot"
          git config user.email "ci-news-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -q -m "News update $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3 4 5; do
            git pull -q --rebase --autostash -X theirs && git push -q && exit 0
            echo "Push attempt $attempt failed, retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "Could not save data after 5 attempts"
          exit 1

      # Publish the site (index.html + data/) to GitHub Pages
      - name: Build site folder
        run: mkdir -p _site && cp index.html _site/ && cp -r data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
