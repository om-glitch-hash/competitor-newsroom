# Competitor newsroom tracker: master company list
#
# Fields
#   name      Company name shown on the dashboard
#   site      Company website / newsroom URL. The fetcher looks here for an RSS/Atom feed.
#   rss       (optional) Exact feed URL. Use it when auto-discovery picks the wrong feed.
#   keywords  (optional) Only keep items that mention one of these words. Use for big,
#             diversified companies (J&J, Lilly, Medtronic...) so the feed isn't flooded.
#   verify    true = website not confirmed when the list was built; check data/status.json
#   trials    ClinicalTrials.gov search: terms (drug names/codes), sponsor, condition
#   lists     Where the company appears: program, list, priority (1 = High, 2 = Medium, 3 = Low), assets
#
# To add a company: copy a block, edit it, commit. The next run (within 15 min) picks it up.

companies:

